apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: apic-nano-gateway
  title: DataPower Nano Gateway
  description: Provision an IBM API Connect DataPower Nano Gateway using Terraform and Ansible
  tags:
    - apic
    - gateway
    - terraform
    - gitops
spec:
  owner: lab-instructors
  type: gateway

  parameters:
    - title: Gateway Configuration
      required:
        - gateway_name
        - environment
        - replicas
      properties:
        gateway_name:
          title: Gateway Name
          type: string
          description: Name for your gateway (e.g. my-nano-gw)
          pattern: '^[a-z0-9-]+$'
          ui:autofocus: true
        environment:
          title: Environment
          type: string
          description: Target environment
          default: dev
          enum:
            - dev
            - staging
            - production
        replicas:
          title: Replicas
          type: integer
          description: Number of gateway replicas
          default: 1
          minimum: 1
          maximum: 3

    - title: Student Information
      required:
        - namespace
      properties:
        namespace:
          title: Your Namespace
          type: string
          description: Your assigned namespace (e.g. student-07)
          ui:field: EntityNamePicker

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          gateway_name: ${{ parameters.gateway_name }}
          environment: ${{ parameters.environment }}
          replicas: ${{ parameters.replicas }}
          namespace: ${{ parameters.namespace }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        allowedHosts: ['github.com']
        description: Gateway ${{ parameters.gateway_name }} for ${{ parameters.namespace }}
        repoUrl: github.com?owner=aldobustios&repo=${{ parameters.namespace }}-${{ parameters.gateway_name }}
        defaultBranch: main

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: GitHub Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
