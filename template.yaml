apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: apic-nano-gateway
  title: API Gateway as Code
  description: Crea un API en IBM API Connect usando Terraform y Ansible
  tags:
    - apic
    - gateway
    - terraform
    - gitops
spec:
  owner: lab-instructors
  type: gateway

  parameters:
    - title: Configuración del API
      required:
        - gateway_name
        - namespace
      properties:
        gateway_name:
          title: Nombre del API
          type: string
          description: Nombre para tu API (solo letras minúsculas y guiones, ej. my-api)
          pattern: '^[a-z0-9-]+$'
          ui:autofocus: true
        namespace:
          title: Tu Namespace
          type: string
          description: Tu namespace asignado
          enum:
            - student-01
            - student-02
            - student-03
            - student-04
            - student-05
            - student-06
            - student-07
            - student-08
            - student-09
            - student-10
            - student-11
            - student-12
            - student-13
            - student-14
            - student-15
            - student-16
            - student-17
            - student-18
            - student-19
            - student-20
            - student-21
            - student-22
            - student-23
            - student-24
            - student-25
            - student-26
            - student-27
            - student-28
            - student-29
            - student-30

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          gateway_name: ${{ parameters.gateway_name }}
          namespace: ${{ parameters.namespace }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: API ${{ parameters.gateway_name }} for ${{ parameters.namespace }}
        repoUrl: github.com?owner=aldobustios&repo=${{ parameters.namespace }}-${{ parameters.gateway_name }}
        defaultBranch: main
        repoVisibility: public

    - id: webhook
      name: Create Tekton Webhook
      action: github:webhook
      input:
        repoUrl: github.com?owner=aldobustios&repo=${{ parameters.namespace }}-${{ parameters.gateway_name }}
        webhookUrl: http://el-github-listener-openshift-pipelines.apps.itz-jyz46m.infra01-lb.wdc07.techzone.ibm.com
        webhookSecret: TechXchange2026Webhook
        events:
          - push
        contentType: json
        insecureSsl: true

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repositorio GitHub
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Ver en Catálogo
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: API en APIC
        url: https://apic-lab-gw-gateway-apic.apps.itz-jyz46m.infra01-lb.wdc07.techzone.ibm.com/lab-organization/${{ parameters.namespace }}-catalog/hello
